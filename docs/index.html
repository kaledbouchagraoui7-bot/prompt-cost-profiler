<!DOCTYPE html><html><body><h1>Prompt Profiler</h1><textarea id='in'></textarea><button onclick='calc()'>Calculate</button><pre id='out'></pre><script>function calc(){const t=document.getElementById('in').value;const tokens=Math.floor(t.split(' ').length*1.33);document.getElementById('out').innerText='Tokens: '+tokens+' | Est Cost: $'+(tokens/1000*0.002).toFixed(6);}</script></body></html>
